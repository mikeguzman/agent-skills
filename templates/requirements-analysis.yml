# Requirements analysis — copy to .github/workflows/ in a repo that receives
# requirement issues (labels req:analizar / req:aprobado, body sections
# <!-- requerimiento --> and <!-- analisis -->).
#
# What it does: when an issue gets the `req:analizar` label, Claude Code runs
# the product-owner skill against the checked-out repo and writes its analysis
# into the issue. When an issue gets `req:aprobado`, the same skill does the
# handoff: adds the task to the repo's plan on a branch and opens a PR.
#
# ON DEMAND, NOT ON EVERY COMMENT. It used to fire on any human comment on a
# `req:*` issue too, so every answer to an open question paid for a full
# re-analysis. Measured 2026-09-19 on the first three real requirements: a
# run costs USD 0.71 to 4.17 (22 to 77 turns), and a failed run that wrote
# nothing still cost 0.71; the three analyses left nine open questions.
# Answer as many comments as you like for free, then re-run: the agent
# removes `req:analizar` when it finishes, so putting it back is the
# "analyze again" button.
#
# Prerequisites in the repo: the Claude Code GitHub App installed
# (`/install-github-app` from a Claude Code session), which also creates
# the CLAUDE_CODE_OAUTH_TOKEN secret; swap the commented line below if a
# repo uses ANTHROPIC_API_KEY instead.
# The marketplace below is a private repo: either make it public or give
# the job a token that can read it — see the README.
#
# Status: UNTESTED until its first real run. The label-triggered form of
# the action is not among the documented examples; the first run confirms
# it. Keep this comment until then.

name: Requirements analysis

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write        # handoff opens a branch
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: requirements-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issues' &&
        (github.event.label.name == 'req:analizar' || github.event.label.name == 'req:aprobado')
      )
    runs-on: ubuntu-latest
    # Without this a hung run reaches GitHub's six-hour cap, burning the
    # subscription with nothing to show. The longest real run measured was
    # 20 minutes, so 30 leaves room and still cuts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/mikeguzman/agent-skills.git"
          plugins: "product-owner@mikes-skills"
          # The skill reads plans and journals against the DEFAULT BRANCH, so
          # `git fetch` and `git show origin/main:<path>` must be allowed.
          # Measured 2026-09-19: leaving them out made a run finish with
          # permission_denials_count: 4, write nothing at all, and still
          # report success — a silent no-op is the worst failure shape here.
          claude_args: >-
            --allowedTools "Bash(gh issue view *),Bash(gh issue edit *),Bash(gh issue comment *),Bash(gh pr view *),Bash(gh api *),Bash(gh label list *),Bash(git fetch *),Bash(git show *),Bash(git log *),Bash(git grep *),Bash(git diff *),Bash(git ls-files *),Bash(git rev-parse *),Bash(git branch *),Read,Grep,Glob"
          prompt: |
            Use the product-owner skill on issue #${{ github.event.issue.number || inputs.issue }} of ${{ github.repository }}.
            Event: ${{ github.event_name }}${{ github.event.label && format(' (label: {0})', github.event.label.name) || '' }}.
            If the issue carries the label req:aprobado, do the handoff described in the skill; otherwise do the analysis.
            Use the gh CLI (GH_TOKEN is set) to read the issue and its comments, to edit the issue body, to comment and to change labels.
